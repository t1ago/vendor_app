<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas_Miguel</title>
    <link rel="stylesheet" href="pessoa_cadastro.css">
</head>

<body>
    <div class="container">

        <h1>Pessoas_Miguel</h1>

        <form>

            <!-- Formulário de Pessoa Física -->

            <div class="form-group">
                <button type="button" class="button-address" id="btn_pf">Pessoa Física</button>
                <button type="button" class="button-address" id="btn_pj">Pessoa Jurídica</button>
            </div>


            <section id="formulario-fisico" class="hidden">

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" maxlength="64">
                </div>

                <div class="form-group">
                    <label>Apelido</label>
                    <input type="text" id="apelido" maxlength="64">
                </div>

                <label>Sexo</label>
                <div class="radio-group">
                    <input type="radio" id="campo_sexo_m" name="sexo" value="M">
                    <label for="campo_sexo_m">Masculino</label>

                    <input type="radio" id="campo_sexo_f" name="sexo" value="F">
                    <label for="campo_sexo_f">Feminino</label>
                </div>

                <div class="linha-menor">
                    <div class="form-group">
                        <label>Nascimento</label>
                        <input type="text" id="data_nascimento">
                    </div>

                    <div class="form-group">
                        <label>RG</label>
                        <input type="text" id="rg" maxlength="13">
                    </div>

                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" id="cpf" maxlength="13">
                    </div>
                </div>

                <label>Ativo</label>
                <div class="radio-group">
                    <input type="radio" id="ativoS" name="ativo" value="S">
                    <label for="ativoS">Ativo</label>

                    <input type="radio" id="ativoN" name="ativo" value="N">
                    <label for="ativoN">Inativo</label>
                </div>

                <div class="form-group">
                    <label>Vínculo (Pessoa Jurídica)</label>
                    <select id="vinculo">
                        <option value="">Sem vínculo</option>
                    </select>
                </div>

            </section>

            <!-- Formulário de Pessoa Jurídica -->

            <section id="formulario-juridico" class="hidden">

                <div class="form-group">
                    <label>Razão social</label>
                    <input type="text" id="social" maxlength="64">
                </div>

                <div class="form-group">
                    <label>Nome Fantasia</label>
                    <input type="text" id="fantasia" maxlength="64">
                </div>

                <div class="linha-menor-j">
                    <div class="form-group">
                        <label>CNPJ</label>
                        <input type="text" id="cnpj" maxlength="14">
                    </div>

                    <div class="form-group">
                        <label>Inscrição Estadual</label>
                        <input type="text" id="inscricao" maxlength="14">
                    </div>
                </div>

                <div class="form-group">
                    <label>Ativo</label>
                    <div class="radio-group">
                        <input type="radio" id="ativo_s" value="sim">
                        <label for="ativo_s">Sim</label>

                        <input type="radio" id="ativo_n" value="nao">
                        <label for="ativo_n">Não</label>
                    </div>
                </div>
            </section>

            <!-- Botão Novo Endereço -->


            <div id="button_address" class="hidden">
                <button id="button-address_btn" type="button" class="button-address-s"
                    onclick="carregar_botao()">NovoEndereço</button>
            </div>
            <div id="button_x" class="hidden">
                <button id="x_cancelar" type="button" class=" button-address-s">X</button>
            </div>



            <!-- Formulário de Endereço -->

            <section id="formulario-endereco" class="hidden">

                <div class="endereco-grid">

                    <div class="form-group">
                        <label>CEP</label>
                        <input type="text" id="cep" maxlength="">
                    </div>

                    <div class="form-group">
                        <label>Logradouro</label>
                        <input type="text" id="logradouro" disabled>
                    </div>

                    <div class="form-group">
                        <label>Número</label>
                        <input type="text" id="numero">
                    </div>

                    <div class="form-group">
                        <label>Bairro</label>
                        <input type="text" id="bairro" disabled>
                    </div>

                    <div class="form-group">
                        <label>Cidade</label>
                        <input type="text" id="cidade" disabled>
                    </div>

                    <div class="form-group">
                        <label>Estado</label>
                        <input type="text" id="estado" disabled>
                    </div>

                    <div class="form-group tipo-endereco">
                        <label>Endereço</label>
                        <select id="tipo_endereco">
                            <option value="moradia">Moradia</option>
                            <option value="entrega">Entrega</option>
                            <option value="cobrança">Cobrança</option>
                        </select>
                    </div>

                    <div class="hidden">
                        <label>id_pessoa</label>
                        <input type="text">
                    </div>

                </div>
            </section>

            <!-- Botões Salvar e Voltar PF-->
            <section id="button" class="hidden">
                <div class="botoes-lado">
                    <button id="btn_back" class="btn-acao btn-back">Voltar</button>
                    <button id="btn_save" type="button" class="btn-acao btn-save">Salvar</button>
                </div>
            </section>

            <!-- Botões Salvar e Voltar PJ-->
            <section id="button_juridico" class="hidden">
                <div class="botoes-lado">
                    <button id="btn_back_juridico" class="btn-acao btn-back">Voltar</button>
                    <button id="btn_save_juridico" class="btn-acao btn-save">Salvar</button>
                </div>
            </section>

        </form>
    </div>

    <script src="../../../../config.js"></script>
    <script src="url.js"></script>
    <script src="pessoa_cadastro.js"></script>
</body>

</html>
