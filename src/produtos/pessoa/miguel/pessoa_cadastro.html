<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas_Miguel</title>
    <link rel="stylesheet" href="pessoa_cadastro.css">
</head>

<body>
    <div class="container">

        <h1>Pessoas_Miguel</h1>

        <form>

            <!-- Formulário de Pessoa Física -->

            <div class="form-group">
                <button type="button" class="button-address" id="btn_pf">Pessoa Física</button>
                <button type="button" class="button-address" id="btn_pj">Pessoa Jurídica</button>
            </div>


            <section id="formulario-fisico" class="hidden">

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" required maxlength="64">
                </div>

                <div class="form-group">
                    <label>Apelido</label>
                    <input type="text" id="apelido" required maxlength="64">
                </div>

                <div class="form-group">
                    <label>Sexo</label>
                    <div class="radio-group">
                        <input type="radio" id="masculino" value="masculino" required>
                        <label for="ativo_s">Masculino</label>

                        <input type="radio" id="feminino" value="feminino" required>
                        <label for="ativo_n">Feminino</label>
                    </div>
                </div>

                <div class="linha-menor">
                    <div class="form-group">
                        <label>Nascimento</label>
                        <input type="text" id="data_nascimento" required>
                    </div>

                    <div class="form-group">
                        <label>RG</label>
                        <input type="text" id="rg" required maxlength="13">
                    </div>

                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" id="cpf" required maxlength="13">
                    </div>
                </div>

                <div class="form-group">
                    <label>Ativo</label>
                    <div class="radio-group">
                        <input type="radio" id="ativo_s" value="sim" required>
                        <label for="ativo_s">Sim</label>

                        <input type="radio" id="ativo_n" value="nao" required>
                        <label for="ativo_n">Não</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Vinculo</label>
                    <div class="radio-group">
                        <input type="radio" id="vinculo_s" value="sim" required>
                        <label for="vinculo_s">Sim</label>

                        <input type="radio" id="vinculo_n" value="nao" required>
                        <label for="vinculo_n">Não</label>
                    </div>
                </div>
            </section>

            <!-- Formulário de Pessoa Jurídica -->

            <section id="formulario-juridico" class="hidden">

                <div class="form-group">
                    <label>Razão social</label>
                    <input type="text" id="social" required maxlength="64">
                </div>

                <div class="form-group">
                    <label>Nome Fantasia</label>
                    <input type="text" id="fantasia" required maxlength="64">
                </div>

                <div class="linha-menor-j">
                    <div class="form-group">
                        <label>CNPJ</label>
                        <input type="text" id="cnpj" required maxlength="14">
                    </div>

                    <div class="form-group">
                        <label>Inscrição Estadual</label>
                        <input type="text" id="inscricao" required maxlength="14">
                    </div>
                </div>

                <div class="form-group">
                    <label>Ativo</label>
                    <div class="radio-group">
                        <input type="radio" id="ativo_s" value="sim" required>
                        <label for="ativo_s">Sim</label>

                        <input type="radio" id="ativo_n" value="nao" required>
                        <label for="ativo_n">Não</label>
                    </div>
                </div>
            </section>

            <!-- Botão Novo Endereço -->


            <div id="button_address" class="hidden">
                <button type="button" class="button-address-s" onclick="carregar_botao()">NovoEndereço</button>
            </div>
            <div id="button_x">
                <button id="x_cancelar" type="button" class="hidden button-address-s">X</button>
            </div>



            <!-- Formulário de Endereço -->

            <section id="formulario-endereco" class="hidden">

                <div class="endereco-grid">

                    <div class="form-group">
                        <label>CEP</label>
                        <input type="text" id="cep" required maxlength="">
                    </div>

                    <div class="form-group">
                        <label>Logradouro</label>
                        <input type="text" id="logradouro" required>
                    </div>

                    <div class="form-group">
                        <label>Número</label>
                        <input type="text" id="numero" required>
                    </div>

                    <div class="form-group">
                        <label>Bairro</label>
                        <input type="text" id="bairro" required>
                    </div>

                    <div class="form-group">
                        <label>Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>

                    <div class="form-group">
                        <label>Estado</label>
                        <input type="text" id="estado" required>
                    </div>

                    <div class="form-group tipo-endereco">
                        <label>Endereço</label>
                        <select id="tipo_endereco">
                            <option value="moradia">Moradia</option>
                            <option value="entrega">Entrega</option>
                            <option value="cobrança">Cobrança</option>
                        </select>
                    </div>

                    <div class="hidden">
                        <label>id_pessoa</label>
                        <input type="text">
                    </div>

                </div>
            </section>

            <!-- Botões Salvar e Voltar PF-->
            <section id="button" class="hidden">
                <div class="botoes-lado">
                    <button id="btn_back" class="btn-acao btn-back">Voltar</button>
                    <button id="btn_save" class="btn-acao btn-save">Salvar</button>
                </div>
            </section>

            <!-- Botões Salvar e Voltar PJ-->
            <section id="button_juridico" class="hidden">
                <div class="botoes-lado">
                    <button id="btn_back_juridico" class="btn-acao btn-back">Voltar</button>
                    <button id="btn_save_juridico" class="btn-acao btn-save">Salvar</button>
                </div>
            </section>

        </form>
    </div>

    <script src="../../../../config.js"></script>
    <script src="url.js"></script>
    <script src="pessoa_cadastro.js"></script>
</body>

</html>
